<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>璞永敦安答客問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 璞永敦安 答客問（建材・施工篇）— 業務內部使用
   顏色沿用客變服務專區：墨綠底、香檳金、白字 */
:root {
  --ink: #050a06;
  --forest: #13261b;
  --forest-2: #1d3a2a;
  --gold: #c9bc9c;
  --gold-deep: #7d6c45;
  --paper: #f6f4ef;
  --card: #ffffff;
  --text: #1c241f;
  --muted: #5d665f;
  --line: #e2ddd1;
  --mark: #f3e3a8;
  --radius: 12px;
  --header-h: 68px;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
[id] { scroll-margin-top: calc(var(--header-h) + 16px); }
body {
  margin: 0; background: var(--paper); color: var(--text);
  font-family: var(--sans); font-size: 17px; line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }

/* ---------- 頁首 ---------- */
.top {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  background: var(--ink); border-bottom: 1px solid rgba(201,188,156,.2);
  display: flex; align-items: center; gap: 20px; padding: 0 24px;
}
.brand { display: flex; align-items: center; gap: 12px; color: var(--gold); text-decoration: none; flex-shrink: 0; }
.brand img { height: 40px; width: auto; mix-blend-mode: screen; }
.brand span { font-size: 14px; letter-spacing: .2em; padding-left: 12px; border-left: 1px solid rgba(201,188,156,.4); white-space: nowrap; }
.search { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
.search input {
  width: 100%; height: 42px; border-radius: 21px; border: 1px solid rgba(201,188,156,.35);
  background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 16px; padding: 0 44px 0 18px;
}
.search input::placeholder { color: rgba(255,255,255,.5); }
.search input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,.1); }
.search kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font: 12px var(--sans); color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 0 6px;
}
.tools { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  height: 38px; padding: 0 14px; border-radius: 19px; cursor: pointer; white-space: nowrap;
  border: 1px solid rgba(201,188,156,.4); background: transparent; color: var(--gold); font: inherit; font-size: 14px;
}
.btn:hover { background: rgba(201,188,156,.12); }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

/* ---------- 封面 ---------- */
.hero {
  display: grid; grid-template-columns: 1.1fr .9fr; min-height: 340px;
  background: var(--forest); color: #fff;
}
.hero-text { padding: 56px 56px 48px; display: flex; flex-direction: column; justify-content: center; }
.hero-text .eyebrow { color: var(--gold); letter-spacing: .3em; font-size: 14px; }
.hero-text h1 { font-family: var(--serif); font-weight: 700; font-size: 44px; line-height: 1.35; margin: 10px 0 14px; letter-spacing: .06em; }
.hero-text p { margin: 0; color: rgba(255,255,255,.75); }
.meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.meta span { border: 1px solid rgba(201,188,156,.45); color: var(--gold); border-radius: 14px; padding: 2px 12px; font-size: 14px; }
.hero-img { background: url("assets/exterior.jpg") center 35% / cover no-repeat; }

/* ---------- 版面 ---------- */
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 40px; max-width: 1280px; margin: 0 auto; padding: 36px 24px 80px; }
.toc { position: sticky; top: calc(var(--header-h) + 20px); align-self: start; max-height: calc(100vh - var(--header-h) - 40px); overflow-y: auto; }
.toc h3 { font-family: var(--serif); font-size: 17px; color: var(--gold-deep); margin: 18px 0 6px; letter-spacing: .1em; }
.toc h3:first-child { margin-top: 0; }
.toc a {
  display: flex; justify-content: space-between; gap: 8px; padding: 5px 12px; border-radius: 8px;
  color: var(--text); text-decoration: none; font-size: 15px; border-left: 3px solid transparent;
}
.toc a:hover { background: #ebe7dd; }
.toc a.active { border-left-color: var(--gold-deep); background: #ebe7dd; font-weight: 500; }
.toc a small { color: var(--muted); }
.toc a.empty { opacity: .35; pointer-events: none; }

.part-title {
  font-family: var(--serif); font-size: 30px; margin: 8px 0 4px; letter-spacing: .12em;
  display: flex; align-items: baseline; gap: 14px;
}
.part-title small { font-family: var(--sans); font-size: 14px; color: var(--muted); letter-spacing: 0; }
.part + .part { margin-top: 56px; }
.cat h2 {
  font-size: 19px; font-weight: 700; color: var(--forest-2); margin: 30px 0 12px;
  padding-bottom: 8px; border-bottom: 2px solid var(--line); display: flex; justify-content: space-between;
}
.cat h2 small { font-weight: 400; color: var(--muted); font-size: 14px; }

/* ---------- 題目卡片 ---------- */
.qa { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.qa summary {
  list-style: none; cursor: pointer; display: flex; gap: 14px; align-items: flex-start;
  padding: 16px 20px; font-weight: 500; font-size: 18px;
}
.qa summary::-webkit-details-marker { display: none; }
.qa summary:hover { background: #fbfaf7; }
.qa .no {
  flex-shrink: 0; min-width: 62px; text-align: center; font-size: 13px; font-weight: 500; letter-spacing: .05em;
  color: var(--gold-deep); border: 1px solid var(--gold); border-radius: 12px; padding: 1px 8px; margin-top: 3px;
}
.qa .q { flex: 1; }
.qa .chev { flex-shrink: 0; width: 22px; height: 22px; margin-top: 4px; color: var(--muted); transition: transform .2s; }
.qa[open] .chev { transform: rotate(180deg); }
.qa[open] summary { border-bottom: 1px dashed var(--line); }
.ans { padding: 16px 20px 20px 96px; }
.ans p { margin: 0 0 8px; }
.ans p:last-child { margin-bottom: 0; }
.ans ul, .ans ol { margin: 4px 0 10px; padding-left: 1.4em; }
.ans .label { font-weight: 700; color: var(--forest-2); margin-top: 10px; }
.ans .note { font-size: 15px; color: var(--muted); background: var(--paper); border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
.ans .internal { font-size: 15px; color: #7a4a12; background: #fbf1df; border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
.ans table { border-collapse: collapse; margin: 8px 0 10px; font-size: 16px; }
.ans th, .ans td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
.ans th { background: var(--paper); font-weight: 500; }
.ans .big { font-size: 22px; font-weight: 700; color: var(--forest-2); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

.no-result { display: none; text-align: center; color: var(--muted); padding: 60px 0; }
.hidden { display: none !important; }

footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 24px 40px; }

/* ---------- 手機查閱 QR Code ---------- */
.qr-modal { position: fixed; inset: 0; z-index: 100; background: rgba(5,10,6,.82); display: none; align-items: center; justify-content: center; padding: 24px; }
.qr-modal.on { display: flex; }
.qr-card { background: var(--card); border-radius: 16px; padding: 28px 32px; text-align: center; max-width: 360px; width: 100%; }
.qr-card h3 { font-family: var(--serif); margin: 0 0 4px; font-size: 22px; letter-spacing: .08em; }
.qr-card p { margin: 0; color: var(--muted); font-size: 15px; }
.qr-card svg { width: 240px; height: 240px; margin: 18px auto 14px; display: block; }
.qr-card .url { font-weight: 500; color: var(--gold-deep); font-size: 17px; user-select: all; }
.qr-card button { margin-top: 18px; border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 6px 22px; font: inherit; cursor: pointer; }

/* ---------- 窄螢幕 ---------- */
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .toc { display: none; }
  .hero { grid-template-columns: 1fr; }
  .hero-img { min-height: 220px; }
}
@media (max-width: 720px) {
  .top { padding: 0 16px; gap: 10px; }
  .brand span, .tools .btn:not(#btn-toggle), .search kbd { display: none; }
  .hero-text { padding: 32px 20px; }
  .hero-text h1 { font-size: 32px; }
  .layout { padding: 24px 16px 60px; }
  .ans { padding: 14px 16px 18px; }
}

/* ---------- 列印 ---------- */
@media print {
  @page { size: A4; margin: 16mm 14mm; }
  body { background: #fff; font-size: 11pt; line-height: 1.65; }
  .top, .toc, .chev, .qr-modal { display: none !important; }
  .hero { display: block; background: none; color: var(--text); min-height: 0; border-bottom: 2px solid var(--gold-deep); margin-bottom: 8mm; }
  .hero-img { display: none; }
  .hero-text { padding: 0 0 4mm; }
  .hero-text h1 { font-size: 22pt; }
  .hero-text p { color: var(--muted); }
  .meta span { color: var(--gold-deep); border-color: var(--gold-deep); }
  .layout { display: block; padding: 0; max-width: none; }
  .part + .part { break-before: page; margin-top: 0; }
  .cat h2 { break-after: avoid; }
  .qa { break-inside: avoid; border-radius: 0; border-width: 0 0 1px; margin: 0; }
  .qa summary { padding: 8px 0 2px; font-size: 12pt; }
  .qa[open] summary { border-bottom: 0; }
  .ans { padding: 0 0 8px 76px; display: block !important; }
  .hidden { display: block !important; }
  .no-result { display: none !important; }
  mark { background: none; }
  footer { padding: 6mm 0 0; }
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#top">
    <img src="assets/logo-duan.png" alt="璞永敦安">
    <span>答客問</span>
  </a>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋問題或答案，例如：玻璃、防水、天花高度" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="tools">
    <button class="btn" id="btn-toggle" type="button">全部展開</button>
    <button class="btn" id="btn-qr" type="button">手機查閱</button>
    <button class="btn" id="btn-print" type="button">列印</button>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-text">
    <div class="eyebrow">業務銷售說明</div>
    <h1>璞永敦安<br>答客問</h1>
    <p>建材・施工・客變・驗屋。點選問題即可展開答案；按 <b>/</b> 可直接搜尋。</p>
  </div>
  <div class="hero-img" role="img" aria-label="璞永敦安外觀透視圖"></div>
</section>

<div class="layout">
  <nav class="toc" id="toc" aria-label="分類目錄"></nav>
  <main id="main">
    <div class="no-result" id="no-result">找不到符合的題目，換個關鍵字試試。</div>
  </main>
</div>

<footer>璞永敦安 答客問｜資料來源：工務設計 115.10.01 設計部修改版、預售房地買賣契約 20260904 預檢版｜業務內部使用，請勿外流</footer>

<div class="qr-modal" id="qr-modal">
  <div class="qr-card">
    <h3>手機查閱</h3>
    <p>用手機相機掃描，即可在手機上查閱答客問</p>
    <svg id="qr-svg" viewBox="0 0 33 33" shape-rendering="crispEdges" aria-label="答客問網址 QR Code"></svg>
    <div class="url">tinyurl.com/26b66znl</div>
    <button type="button" id="qr-close">關閉</button>
  </div>
</div>

<script>
/* ===== 題目資料 =====
   id：題號標籤，例如 建材-04
   要改題目或答案，直接改下面的文字即可 */
const DATA = [
{ part: "建材篇", en: "Materials", cats: [
  { name: "室內裝修", items: [
    { id: "建材-01", q: "客、餐廳、走道地坪？材質？尺寸？",
      a: `<p>約 5.4 吋（162mm）海島型企口木地板，或 80×80cm 拋光石英磚。</p>` },
    { id: "建材-02", q: "室內木地板條數（木皮厚度）？名稱？",
      a: `<p>昇詮－超耐磨海島型木地板。</p>` },
    { id: "建材-03", q: "廚具上方、後方是否有貼磚？材質？尺寸？有無天花板？",

          <p>此塗料不添加甲醛及汞、鎘等重金屬，具低散發、低汙染、低臭氧等特性，對人體健康不會造成危害。</p>` },
  ]},
  { name: "門窗玻璃", items: [
    { id: "建材-04", q: "玻璃材質？厚度？鋁門窗特色說明？",
      a: `<p class="label">玻璃</p>
          <ul>
            <li>鋁窗玻璃：5+5mm 膠合玻璃（視風壓強度而定）</li>
            <li>廚房通風門：6mm（灰）強化玻璃</li>
            <li>部分公設：8mm（灰）熱硬化玻璃（視風壓強度而定）</li>
          </ul>
          <p class="label">單層鋁窗性能</p>
          <table>
            <tr><th>耐風壓</th><td>2800 Pa（每平方公尺可抵抗 280 kg，可抵抗 15～16 級風）</td></tr>
            <tr><th>水密性</th><td>1000 Pa（符合國家標準值）</td></tr>
            <tr><th>氣密性</th><td>2 m³/hr‧㎡</td></tr>
            <tr><th>遮音性</th><td>可阻隔噪音 35 dB（廚房通風門除外）</td></tr>
          </table>` },
  ]},
  { name: "給排水", items: [
    { id: "建材-05", q: "冷熱水管材質？",
      a: `<p>各戶室內冷熱水管皆採用不鏽鋼被覆管，局部搭配樹脂水管。</p>` },
    { id: "建材-06", q: "水塔是否為雙水箱設計？",
      a: `<p>屋頂水塔無雙水箱之設計。</p>` },
    { id: "建材-19", q: "是否配置淨水除氯設備？",
      a: `<ul>
            <li>考量維護與便利性，於社區進水端（地下室水箱）設置全自動反洗過濾設備。</li>
            <li>屋頂水箱設置活性碳除氯設備及紫外線殺菌器。</li>
          </ul>` },
    { id: "建材-25", q: "本棟採用加壓馬達樓層及減壓閥樓層為何？",

            <tr><th>加壓馬達樓層</th><td>12F～14F</td></tr>

          </table>` },
    { id: "建材-26", q: "瓦斯外管費用？",
      a: `<p>基地內由建設公司建置；基地外由住戶分攤（含警報器、瓦斯錶通信設備及緊急遮斷設備）。</p>` },
  ]},
  { name: "電力與緊急供電", items: [
    { id: "建材-12", q: "斷電時的啟動方式？緊急供電可以連續使用多久？",
      a: `<p>台電停電時，發電機會藉由電瓶起動，經 ATS（自動切換開關）供應緊急電力。</p>

    { id: "建材-08", q: "監控系統是哪一家設備廠商？特色？",
      a: `<p>宗亞科技。採用 7 吋網路型影視對講保全語音主機，可透過網路連結手機。</p>` },
    { id: "建材-09", q: "社區戶外安全規劃為何？",

            <li>室外紅外線攝影機。</li>
            <li>場景位移偵測：當監視器被遮蔽、移動、噴漆或焦距被移動，導致無法清楚錄下監控畫面時，系統會自動發出警報。</li>

  { name: "公設與設備", items: [

    { id: "建材-18", q: "電梯有哪些防疫配備？",

/* ===== 產生畫面 ===== */
const main = document.getElementById("main");
const toc = document.getElementById("toc");
const noResult = document.getElementById("no-result");
const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
let total = 0;

DATA.forEach((part, pi) => {
  const sec = document.createElement("section");
  sec.className = "part";
  sec.innerHTML = `<div class="part-title">${part.part}<small>${part.en}</small></div>`;
  const tocHead = document.createElement("h3");
  tocHead.textContent = part.part;
  toc.appendChild(tocHead);

  part.cats.forEach((cat, ci) => {
    const catId = `c${pi}-${ci}`;
    const box = document.createElement("div");
    box.className = "cat";
    box.id = catId;
    box.innerHTML = `<h2>${cat.name}<small>${cat.items.length} 題</small></h2>`;
    cat.items.forEach(it => {
      total++;
      const d = document.createElement("details");
      d.className = "qa";
      d.id = it.id;
      d.innerHTML = `<summary><span class="no">${it.id.replace("-", " ")}</span><span class="q">${it.q}</span>${chev}</summary>
        <div class="ans"><div class="body">${it.a}</div></div>`;
      box.appendChild(d);
    });
    sec.appendChild(box);
    const a = document.createElement("a");
    a.href = "#" + catId;
    a.dataset.cat = catId;
    a.innerHTML = `${cat.name}<small>${cat.items.length}</small>`;
    toc.appendChild(a);
  });
  main.insertBefore(sec, noResult);
});

/* ===== 搜尋 ===== */
const input = document.getElementById("q");
const allQA = [...document.querySelectorAll(".qa")];
allQA.forEach(d => {
  d._q = d.querySelector(".q");
  d._body = d.querySelector(".body");
  d._qHTML = d._q.innerHTML;
  d._bodyHTML = d._body.innerHTML;
});

function highlight(html, kw) {
  // 只在標籤外的文字加上標記
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) => tag ? tag : text.replace(re, s => `<mark>${s}</mark>`));
}

function runSearch() {
  const kws = input.value.trim().split(/\s+/).filter(Boolean);
  let shown = 0;
  allQA.forEach(d => {
    d._q.innerHTML = d._qHTML;
    d._body.innerHTML = d._bodyHTML;
    if (!kws.length) { d.classList.remove("hidden"); return; }
    const text = (d.id + d._q.textContent + d._body.textContent).toLowerCase();
    const hit = kws.every(k => text.includes(k.toLowerCase()));
    d.classList.toggle("hidden", !hit);
    if (hit) {
      shown++;
      d.open = true;
      kws.forEach(k => { d._q.innerHTML = highlight(d._q.innerHTML, k); d._body.innerHTML = highlight(d._body.innerHTML, k); });
    }
  });
  document.querySelectorAll(".cat").forEach(c => {
    const any = c.querySelector(".qa:not(.hidden)");
    c.classList.toggle("hidden", !any);
    toc.querySelector(`[data-cat="${c.id}"]`).classList.toggle("empty", !any);
  });
  document.querySelectorAll(".part").forEach(p => p.classList.toggle("hidden", !p.querySelector(".cat:not(.hidden)")));
  noResult.style.display = kws.length && !shown ? "block" : "none";
  if (!kws.length) allQA.forEach(d => d.open = false);
  updateToggleLabel();
}
input.addEventListener("input", runSearch);
input.addEventListener("keydown", e => { if (e.key === "Escape") { input.value = ""; runSearch(); input.blur(); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
});

/* ===== 全部展開 / 收合 ===== */
const btnToggle = document.getElementById("btn-toggle");
function updateToggleLabel() {
  const visible = allQA.filter(d => !d.classList.contains("hidden"));
  btnToggle.textContent = visible.length && visible.every(d => d.open) ? "全部收合" : "全部展開";
}
btnToggle.addEventListener("click", () => {
  const visible = allQA.filter(d => !d.classList.contains("hidden"));
  const openAll = !visible.every(d => d.open);
  visible.forEach(d => d.open = openAll);
  updateToggleLabel();
});
allQA.forEach(d => d.addEventListener("toggle", updateToggleLabel));

/* ===== 列印：先全部展開 ===== */
let openedBeforePrint = [];
window.addEventListener("beforeprint", () => {
  openedBeforePrint = allQA.map(d => d.open);
  allQA.forEach(d => d.open = true);
});
window.addEventListener("afterprint", () => allQA.forEach((d, i) => d.open = openedBeforePrint[i]));
document.getElementById("btn-print").addEventListener("click", () => window.print());

/* ===== 目錄跟著捲動標示目前分類 ===== */
const tocLinks = [...toc.querySelectorAll("a")];
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) tocLinks.forEach(a => a.classList.toggle("active", a.dataset.cat === en.target.id));
  });
}, { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll(".cat").forEach(c => io.observe(c));

/* ===== 手機查閱 QR Code =====
   內容為 https://tinyurl.com/26b66znl（指向 https://stussy9092-gif.github.io/duan-qa/）
   每列 29 格，以 16 進位記錄黑白，不需網路即可顯示 */
const QR_ROWS = "1fc53c7f,1056dc41,1758a75d,17531c5d,1740325d,10472841,1fd5557f,00107600,105c1dce,158c93b6,1643f930,1d0e8788,0f5ab141,141a1af3,0bd00d8c,00372425,0c4c1a0c,13a9cf77,18742219,10ab8700,14d96bf7,00114d18,1fc4035c,10467710,1742cff8,1740cf0e,174078fe,104cdc9d,1fd162fc".split(",");
(function drawQR() {
  const n = QR_ROWS.length, pad = 2;
  let d = "";
  QR_ROWS.forEach((hex, r) => {
    const bits = parseInt(hex, 16).toString(2).padStart(n, "0");
    for (let c = 0; c < n; c++) if (bits[c] === "1") d += `M${c + pad},${r + pad}h1v1h-1z`;
  });
  document.getElementById("qr-svg").innerHTML = `<rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/>`;
})();
const qrModal = document.getElementById("qr-modal");
document.getElementById("btn-qr").addEventListener("click", () => qrModal.classList.add("on"));
document.getElementById("qr-close").addEventListener("click", () => qrModal.classList.remove("on"));
qrModal.addEventListener("click", e => { if (e.target === qrModal) qrModal.classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") qrModal.classList.remove("on"); });
</script>
